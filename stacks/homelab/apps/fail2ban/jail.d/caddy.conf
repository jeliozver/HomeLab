[caddy]
enabled = true
chain = DOCKER-USER
port = http,https
protocol = tcp
filter = caddy
logpath = /var/log/caddy/public/*.log
maxretry = 5
bantime  = 86400
action   = iptables-multiport[name=Caddy, chain=DOCKER-USER, port="%(port)s", protocol="%(protocol)s"]
           notifiarr[bantime="%(bantime)s", port="%(port)s", protocol="%(protocol)s"]