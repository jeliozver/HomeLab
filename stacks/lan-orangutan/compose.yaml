services:
  lan-orangutan:
    container_name: lan-orangutan
    image: ghcr.io/291-group/lan-orangutan:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - ORANGUTAN_PASSWORD=${ORANGUTAN_PASSWORD}
      - ORANGUTAN_PORT=291
      - TZ=${TZ}
    volumes:
      - ./data:/var/lib/lan-orangutan
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:291/static/orangutan.svg"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3