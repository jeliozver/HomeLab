services:
  tracearr:
    container_name: tracearr
    image: ghcr.io/connorgallopo/tracearr:latest
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
    volumes:
      - tracearr_backups:/data/backup
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=${TZ}
      - DATABASE_URL=postgres://tracearr:${DB_PASSWORD:-tracearr}@timescale:5432/tracearr
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
  timescale:
    container_name: tracearr-db
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    restart: unless-stopped
    networks:
      - proxy-net
    volumes:
      - tracearr_timescale_data:/home/postgres/pgdata/data
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${DB_PASSWORD:-tracearr}
      - POSTGRES_DB=tracearr
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=100000 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=150
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    container_name: tracearr-redis
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - proxy-net
    volumes:
      - tracearr_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy-net:
    external: true

volumes:
  tracearr_backups:
    name: tracearr_backups
  tracearr_timescale_data:
    name: tracearr_timescale_data
  tracearr_redis_data:
    name: tracearr_redis_data